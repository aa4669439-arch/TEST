<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>題庫練習</title>
<meta name="theme-color" content="#0b1030">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="題庫練習">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root{
    --bg0:#050814; --bg1:#0b1030;
    --cyan:#22d3ee; --blue:#3b82f6; --violet:#8b5cf6; --magenta:#ec4899;
    --glass:rgba(255,255,255,.045); --glass-brd:rgba(255,255,255,.11);
    --ink:#eaf0ff; --muted:#8b93b8;
    --good:#34e2b0; --good-glow:rgba(52,226,176,.5);
    --bad:#ff5d7a; --bad-glow:rgba(255,93,122,.5);
    --grad:linear-gradient(120deg,var(--cyan),var(--violet) 55%,var(--magenta));
    --radius:20px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;
    color:var(--ink); background:var(--bg0);
    display:flex;justify-content:center;overflow-x:hidden;
  }
  .phone{
    width:100%;max-width:440px;min-height:100vh;position:relative;
    display:flex;flex-direction:column;
    background:
      radial-gradient(120% 60% at 15% -5%, rgba(59,130,246,.32), transparent 60%),
      radial-gradient(120% 55% at 100% 8%, rgba(236,72,153,.26), transparent 55%),
      radial-gradient(140% 60% at 50% 112%, rgba(139,92,246,.30), transparent 60%),
      linear-gradient(180deg,var(--bg1),var(--bg0));
    overflow:hidden;
  }
  /* 動態網格 + 掃描光 */
  .phone::before{
    content:"";position:absolute;inset:0;pointer-events:none;opacity:.4;
    background-image:linear-gradient(rgba(120,160,255,.05) 1px,transparent 1px),
      linear-gradient(90deg,rgba(120,160,255,.05) 1px,transparent 1px);
    background-size:38px 38px;
    -webkit-mask-image:radial-gradient(75% 60% at 50% 25%,#000,transparent);
    mask-image:radial-gradient(75% 60% at 50% 25%,#000,transparent);
  }
  /* 掃描光已依需求移除 */
  /* 漂浮粒子 */
  .spark{position:absolute;width:3px;height:3px;border-radius:50%;pointer-events:none;z-index:1;
    background:var(--cyan);opacity:.5;animation:float linear infinite}
  @keyframes float{0%{transform:translateY(20px);opacity:0}
    15%{opacity:.6}85%{opacity:.6}100%{transform:translateY(-90vh);opacity:0}}

  header{padding:26px 22px 12px;position:relative;z-index:3}
  .logo{display:flex;align-items:center;gap:12px}
  .logo .mark{width:40px;height:40px;flex-shrink:0}
  header h1{
    margin:0;font-size:25px;font-weight:800;letter-spacing:1px;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 16px rgba(139,92,246,.4));
  }
  header p{margin:6px 0 0;font-size:13px;color:var(--muted)}
  main{flex:1;padding:6px 22px 108px;overflow-y:auto;position:relative;z-index:3}
  .view{display:none;animation:rise .38s cubic-bezier(.2,.7,.3,1)}
  .view.active{display:block}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .glass{
    background:var(--glass);border:1px solid var(--glass-brd);border-radius:var(--radius);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    box-shadow:0 8px 32px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.08);
  }
  /* 首頁磚 */
  .tile{
    position:relative;overflow:hidden;padding:20px;margin-bottom:16px;cursor:pointer;
    display:flex;align-items:center;gap:18px;transition:transform .15s ease;
  }
  .tile:active{transform:scale(.97)}
  .tile::after{
    content:"";position:absolute;inset:0;border-radius:var(--radius);padding:1.5px;
    background:var(--grad);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;opacity:.6;transition:opacity .3s;
  }
  .tile:active::after{opacity:1}
  .ic-badge{
    width:56px;height:56px;border-radius:16px;flex-shrink:0;position:relative;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.02));
  }
  .ic-badge svg{width:30px;height:30px}
  .t-practice .ic-badge{box-shadow:inset 0 0 0 1px rgba(34,211,238,.45),0 0 26px rgba(34,211,238,.3)}
  .t-exam .ic-badge{box-shadow:inset 0 0 0 1px rgba(139,92,246,.45),0 0 26px rgba(139,92,246,.3)}
  .t-review .ic-badge{box-shadow:inset 0 0 0 1px rgba(236,72,153,.45),0 0 26px rgba(236,72,153,.3)}
  .tile h3{margin:0 0 3px;font-size:18px;font-weight:700}
  .tile p{margin:0;font-size:13px;color:var(--muted)}
  .tile .arrow{margin-left:auto;color:var(--muted);font-size:22px}
  .homestat{display:flex;gap:12px;margin-top:4px}
  .homestat .glass{flex:1;padding:14px;text-align:center}
  .homestat .n{font-size:22px;font-weight:800;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .homestat .l{font-size:11px;color:var(--muted);margin-top:2px}
  .btn{
    border:none;border-radius:14px;padding:15px;width:100%;
    font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;color:#fff;
    background:var(--grad);background-size:180% 180%;
    box-shadow:0 6px 26px rgba(139,92,246,.45);
    margin-top:10px;transition:transform .12s;animation:flow 6s ease infinite;
  }
  @keyframes flow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  .btn:active{transform:translateY(1px) scale(.99)}
  .btn.ghost{background:var(--glass);border:1px solid var(--glass-brd);
    box-shadow:none;animation:none;color:var(--ink)}
  .back{background:none;border:none;font-size:15px;color:var(--cyan);
    cursor:pointer;padding:8px 0;font-family:inherit;margin-bottom:8px}
  .bar{height:8px;background:rgba(255,255,255,.07);border-radius:5px;
    overflow:hidden;margin-bottom:18px;border:1px solid rgba(255,255,255,.06)}
  .bar > i{display:block;height:100%;width:0;border-radius:5px;
    background:var(--grad);box-shadow:0 0 14px rgba(139,92,246,.6);
    transition:width .35s cubic-bezier(.2,.7,.3,1)}
  .qcard{padding:22px;margin-bottom:16px}
  .qmeta{font-size:12px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
  .qmeta .cat{padding:4px 12px;border-radius:999px;font-weight:600;color:#0a0f22;background:var(--grad)}
  .qmeta .num{color:var(--muted)}
  .qtext{font-size:18px;line-height:1.6;margin-bottom:18px;font-weight:600}
  .opt{
    position:relative;border-radius:14px;padding:15px 16px;margin-bottom:11px;
    cursor:pointer;font-size:15px;line-height:1.45;display:flex;gap:12px;align-items:flex-start;
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);
    transition:transform .12s, border-color .2s, background .2s, box-shadow .2s;
  }
  .opt:active{transform:scale(.985)}
  .opt .k{font-weight:800;flex-shrink:0;width:24px;height:24px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:13px;
    background:rgba(255,255,255,.08);color:var(--cyan)}
  .opt.sel{border-color:var(--violet);background:rgba(139,92,246,.14);box-shadow:0 0 18px rgba(139,92,246,.3)}
  .opt.sel .k{background:var(--violet);color:#fff}
  .opt.correct{border-color:var(--good);background:rgba(52,226,176,.12);box-shadow:0 0 20px var(--good-glow)}
  .opt.correct .k{background:var(--good);color:#04231a}
  .opt.wrong{border-color:var(--bad);background:rgba(255,93,122,.12);box-shadow:0 0 20px var(--bad-glow)}
  .opt.wrong .k{background:var(--bad);color:#2a0510}
  .opt.locked{cursor:default}
  .explain{border-radius:14px;padding:15px;font-size:14px;line-height:1.6;margin-top:8px;display:none;
    background:linear-gradient(145deg,rgba(34,211,238,.10),rgba(139,92,246,.10));
    border:1px solid rgba(34,211,238,.25)}
  .explain.show{display:block;animation:rise .3s ease}
  .explain b{color:var(--cyan)}
  .score{text-align:center;padding:26px 20px 6px}
  .ring{width:170px;height:170px;margin:0 auto 6px;position:relative}
  .ring svg{transform:rotate(-90deg)}
  .ring .big{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .big b{font-size:48px;font-weight:800;line-height:1;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .ring .big span{font-size:12px;color:var(--muted);margin-top:2px}
  .stat{display:flex;gap:12px;margin:18px 0}
  .stat .glass{flex:1;padding:16px;text-align:center}
  .stat .n{font-size:24px;font-weight:800}
  .stat .glass.g .n{color:var(--good)}
  .stat .glass.r .n{color:var(--bad)}
  .stat .l{font-size:12px;color:var(--muted);margin-top:2px}
  .rev-item{padding:16px;margin-bottom:12px}
  .rev-item .rq{font-size:15px;margin-bottom:10px;line-height:1.5;font-weight:600}
  .rev-item .ra{font-size:13px;color:var(--good);font-weight:700}
  .rev-item .re{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.55}
  /* 讀題區 */
  .clear-btn{background:none;border:1px solid var(--glass-brd);color:var(--muted);
    border-radius:999px;padding:6px 14px;font-size:13px;font-family:inherit;cursor:pointer;transition:all .15s}
  .clear-btn:active{opacity:.7}
  .clear-btn.danger{color:#fff;background:var(--bad);border-color:transparent;font-weight:700}
  .quiz-top{display:flex;align-items:center;justify-content:space-between}
  .reset-btn{background:none;border:1px solid var(--glass-brd);color:var(--bad);
    border-radius:999px;padding:6px 14px;font-size:13px;font-family:inherit;cursor:pointer;margin-bottom:8px}
  .reset-btn:active{opacity:.7}
  .qbtns{display:flex;gap:10px}
  .redo-btn{margin-top:10px;width:100%;border:1px solid var(--glass-brd);background:rgba(255,255,255,.05);
    color:var(--cyan);border-radius:12px;padding:11px;font-size:14px;font-family:inherit;cursor:pointer}
  .redo-btn:active{opacity:.8}
  .qbtns .btn{margin-top:10px}
  .qbtns #prevBtn{flex:0 0 34%}
  .qbtns #nextBtn{flex:1}
  .read-item{padding:16px 18px;margin-bottom:12px}
  .read-head{display:flex;align-items:flex-start;gap:10px;cursor:pointer}
  .rchips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none;
    cursor:grab;user-select:none;scroll-behavior:smooth}
  .rchips.dragging{cursor:grabbing;scroll-behavior:auto}
  .rchips.dragging .rchip{pointer-events:none}
  .rchips::-webkit-scrollbar{display:none}
  .rchip{flex-shrink:0;padding:7px 14px;border-radius:999px;font-family:inherit;font-size:13px;cursor:pointer;
    background:rgba(255,255,255,.05);border:1px solid var(--glass-brd);color:var(--muted);transition:all .15s}
  .rchip.on{color:#0a0f22;background:var(--grad);border-color:transparent;font-weight:700}
  .read-no{flex-shrink:0;min-width:26px;height:26px;padding:0 6px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;
    color:#0a0f22;background:var(--grad)}
  .read-q{font-size:15px;line-height:1.55;font-weight:600;flex:1}
  .read-caret{color:var(--muted);font-size:20px;flex-shrink:0;transition:transform .2s;line-height:1.2}
  .read-opts{margin-top:12px;display:flex;flex-direction:column;gap:7px}
  .read-opt{display:flex;gap:9px;align-items:flex-start;font-size:14px;line-height:1.45;
    padding:9px 11px;border-radius:10px;color:var(--muted);
    background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06)}
  .read-opt .rk{font-weight:700;flex-shrink:0}
  .read-opt.read-on{color:var(--ink);background:rgba(52,226,176,.12);
    border-color:var(--good);box-shadow:0 0 14px var(--good-glow)}
  .read-opt.read-on .rk{color:var(--good)}
  .read-opt .tick{margin-left:auto;color:var(--good);font-weight:800}
  .read-exp{display:none;margin-top:12px;border-radius:12px;padding:13px;font-size:13px;line-height:1.6;
    background:linear-gradient(145deg,rgba(34,211,238,.10),rgba(139,92,246,.10));
    border:1px solid rgba(34,211,238,.25)}
  .read-exp.show{display:block;animation:rise .25s ease}
  .read-exp b{color:var(--cyan)}
  .empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:14px;line-height:1.7}
  .empty svg{width:56px;height:56px;margin-bottom:14px;opacity:.7}
  nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);
    width:100%;max-width:440px;z-index:20;
    background:rgba(7,11,26,.75);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-top:1px solid var(--glass-brd);display:flex;padding:10px 0 max(10px,env(safe-area-inset-bottom))}
  nav button{flex:1;background:none;border:none;font-family:inherit;
    font-size:11px;color:var(--muted);cursor:pointer;padding:4px;transition:color .2s;
    display:flex;flex-direction:column;align-items:center;gap:3px}
  nav button svg{width:22px;height:22px}
  nav button.on{color:var(--cyan)}
  nav button.on svg{filter:drop-shadow(0 0 8px rgba(34,211,238,.8))}
  select{width:100%;padding:13px;border-radius:12px;font-size:15px;font-family:inherit;
    background:rgba(255,255,255,.06);border:1px solid var(--glass-brd);color:var(--ink)}
  select option{background:#0d1230;color:var(--ink)}
  h3.card-title{margin:0 0 6px;font-size:18px}
  /* ===== 電影級特效 ===== */
  /* 全螢幕特效畫布 */
  #fxCanvas{position:fixed;inset:0;z-index:90;pointer-events:none}
  /* 主頁極光 */
  .aurora{position:fixed;inset:-20%;z-index:0;pointer-events:none;filter:blur(60px);opacity:.5}
  .aurora i{position:absolute;border-radius:50%;mix-blend-mode:screen}
  .aurora i:nth-child(1){width:60vw;height:60vw;left:-10vw;top:-5vh;background:radial-gradient(circle,#22d3ee44,transparent 60%);animation:aur1 14s ease-in-out infinite alternate}
  .aurora i:nth-child(2){width:70vw;height:70vw;right:-20vw;top:20vh;background:radial-gradient(circle,#8b5cf644,transparent 60%);animation:aur2 18s ease-in-out infinite alternate}
  .aurora i:nth-child(3){width:55vw;height:55vw;left:10vw;bottom:-10vh;background:radial-gradient(circle,#ec489933,transparent 60%);animation:aur3 16s ease-in-out infinite alternate}
  @keyframes aur1{to{transform:translate(8vw,6vh) scale(1.15)}}
  @keyframes aur2{to{transform:translate(-6vw,-8vh) scale(1.2)}}
  @keyframes aur3{to{transform:translate(5vw,-5vh) scale(1.1)}}
  /* 流星 */
  .meteor{position:fixed;z-index:0;pointer-events:none;width:2px;height:2px;border-radius:50%;
    background:#eaf0ff;box-shadow:0 0 6px 2px rgba(140,180,255,.8);opacity:0;animation:meteor 7s linear infinite}
  .meteor::after{content:'';position:absolute;right:0;top:50%;width:120px;height:1.5px;transform:translateY(-50%);
    background:linear-gradient(90deg,transparent,rgba(160,200,255,.9))}
  .meteor.m1{top:12%;left:70%;animation-delay:1s}
  .meteor.m2{top:30%;left:90%;animation-delay:4.2s}
  .meteor.m3{top:6%;left:45%;animation-delay:7.5s;animation-duration:9s}
  @keyframes meteor{0%,88%{opacity:0;transform:translate(0,0) rotate(-35deg)}
    90%{opacity:1}100%{opacity:0;transform:translate(-45vw,32vh) rotate(-35deg)}}
  /* 點選漣漪 */
  .opt{position:relative;overflow:hidden}
  .ripple{position:absolute;border-radius:50%;transform:scale(0);background:rgba(139,92,246,.35);
    animation:rip .55s ease-out forwards;pointer-events:none}
  @keyframes rip{to{transform:scale(3.2);opacity:0}}
  /* 答對:綠光脈衝 */
  .opt.correct{animation:okPulse .6s ease}
  @keyframes okPulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.7)}70%{box-shadow:0 0 0 16px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
  /* 答錯:卡片震動 + 紅光邊緣 */
  .qcard.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97)}
  @keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}
    30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
  /* 全螢幕閃光暈影 */
  .vignette{position:fixed;inset:0;z-index:80;pointer-events:none;opacity:0}
  .vignette.red{background:radial-gradient(ellipse at center,transparent 45%,rgba(239,68,68,.45) 100%);animation:vg .6s ease}
  .vignette.green{background:radial-gradient(ellipse at center,transparent 45%,rgba(52,211,153,.4) 100%);animation:vg .6s ease}
  .vignette.gold{background:radial-gradient(ellipse at center,transparent 30%,rgba(250,204,21,.35) 100%);animation:vgLong 2.2s ease}
  .vignette.dark{background:radial-gradient(ellipse at center,transparent 25%,rgba(0,0,0,.75) 100%);animation:vgLong 2.2s ease}
  @keyframes vg{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
  @keyframes vgLong{0%{opacity:0}20%{opacity:1}80%{opacity:1}100%{opacity:0}}
  /* 結果印章 */
  .stamp{position:fixed;top:38%;left:50%;z-index:95;pointer-events:none;
    transform:translate(-50%,-50%) scale(3) rotate(-14deg);opacity:0;
    font-size:54px;font-weight:900;letter-spacing:6px;padding:10px 30px;border:5px solid;border-radius:14px;
    text-shadow:0 0 30px currentColor;filter:drop-shadow(0 0 24px currentColor)}
  .stamp.pass{color:#34d399;border-color:#34d399;animation:stampIn .7s cubic-bezier(.2,1.6,.3,1) forwards}
  .stamp.fail{color:#ef4444;border-color:#ef4444;animation:stampIn .7s cubic-bezier(.2,1.6,.3,1) forwards, stampShake .4s .7s ease}
  @keyframes stampIn{0%{opacity:0;transform:translate(-50%,-50%) scale(3) rotate(-14deg)}
    60%{opacity:1;transform:translate(-50%,-50%) scale(.92) rotate(-8deg)}
    100%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-10deg)}}
  @keyframes stampShake{25%{transform:translate(-52%,-50%) rotate(-11deg)}75%{transform:translate(-48%,-50%) rotate(-9deg)}}
  .stamp.fadeout{animation:stampOut .5s ease forwards}
  @keyframes stampOut{to{opacity:0;transform:translate(-50%,-60%) scale(1.1) rotate(-10deg)}}
  /* 螢幕故障感(不及格) */
  .glitch{animation:glitch .35s steps(2) 3}
  @keyframes glitch{0%{filter:none}25%{filter:hue-rotate(35deg) saturate(2);transform:translateX(2px)}
    50%{filter:invert(.08);transform:translateX(-2px)}75%{filter:hue-rotate(-25deg);transform:translateX(1px)}100%{filter:none;transform:none}}
  /* ===== 主頁強化動畫 ===== */
  /* logo 呼吸光暈 + 緩慢旋轉高光 */
  .logo .mark{animation:logoBreath 3.2s ease-in-out infinite}
  @keyframes logoBreath{0%,100%{filter:drop-shadow(0 0 6px rgba(139,92,246,.5))}
    50%{filter:drop-shadow(0 0 18px rgba(34,211,238,.9)) drop-shadow(0 0 34px rgba(236,72,153,.5))}}
  /* 主頁卡片:入場依序彈跳 + 待機微漂浮 */
  #v-home.active .tile{opacity:0;animation:tileIn .6s cubic-bezier(.2,1.4,.3,1) forwards}
  #v-home.active .tile:nth-of-type(1){animation-delay:.05s}
  #v-home.active .tile:nth-of-type(2){animation-delay:.15s}
  #v-home.active .tile:nth-of-type(3){animation-delay:.25s}
  #v-home.active .tile:nth-of-type(4){animation-delay:.35s}
  @keyframes tileIn{0%{opacity:0;transform:translateY(26px) scale(.92)}
    70%{opacity:1;transform:translateY(-4px) scale(1.02)}100%{opacity:1;transform:none}}
  /* 待機不漂浮,文字保持穩定 */
  /* icon 徽章轉動光環 */
  .ic-badge{position:relative}
  .ic-badge::after{content:'';position:absolute;inset:-3px;border-radius:inherit;padding:2px;
    background:conic-gradient(from 0deg,transparent 0 300deg,rgba(34,211,238,.9) 330deg,transparent 360deg);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
    animation:orbitRing 3.5s linear infinite}
  @keyframes orbitRing{to{transform:rotate(360deg)}}
  /* 閃爍星星 */

  .flare .g3{width:22%;height:22%;left:58%;top:56%;background:radial-gradient(circle,rgba(139,92,246,.22),transparent 70%)}

    90%,100%{opacity:0;transform:translate(80vw,18vh) scale(1.1)}}

  .ic-badge{overflow:hidden}

    background:linear-gradient(100deg,transparent,rgba(255,255,255,.16) 45%,rgba(160,215,255,.35) 50%,rgba(255,255,255,.16) 55%,transparent);

  #muteBtn{position:absolute;right:18px;top:20px;z-index:5;width:38px;height:38px;border-radius:12px;

  .combo-pop{position:fixed;top:20%;left:50%;z-index:96;pointer-events:none;

  @keyframes comboIn{0%{opacity:0;transform:translateX(-50%) scale(.3) rotate(-6deg)}

</style>
</head>

              stroke-width="13" stroke-linecap="round" stroke-dasharray="452" stroke-dashoffset="452"
              style="transition:stroke-dashoffset 1.1s cubic-bezier(.2,.7,.3,1);filter:drop-shadow(0 0 10px rgba(139,92,246,.7))"/>

</div>
<script>
const QUESTIONS_URL = "questions.json";
let BANK = [];
let session = null;
async function loadBank(){
  try{
    const res = await fetch(QUESTIONS_URL, {cache:"no-store"});
    if(!res.ok) throw new Error(res.status);
    BANK = await res.json();
  }catch(e){ BANK = DEMO; }
  refreshHomeStats();
}
const DEMO = [
  {id:1,category:"示範",q:"這是一題示範題,把 questions.json 放上去就會換成你的題目。以下何者正確?",
   options:["這是示範選項一","這是正確答案","這是示範選項三","這是示範選項四"],
   answer:1,explain:"這題只是示範。之後你把題目 JSON 給我,我幫你加進去。"},
  {id:2,category:"示範",q:"第二題示範,測試多題切換。1+1=?",
   options:["1","2","3","4"],answer:1,explain:"1+1=2。"}
];
function refreshHomeStats(){
  animateNum(document.getElementById('hsTotal'), BANK.length, 700);
  animateNum(document.getElementById('hsWrong'), getWrong().length, 700);
}
function go(view){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('v-'+view).classList.add('active');
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('on'));
  if(view==='home'){document.getElementById('nav-home').classList.add('on');refreshHomeStats();}
  if(view==='read') document.getElementById('nav-read').classList.add('on');
  if(view==='review') document.getElementById('nav-review').classList.add('on');
  // 卡通裝飾只在主頁顯示
  document.querySelectorAll('.deco').forEach(d=>d.style.display = view==='home' ? 'block':'none');
  document.querySelector('main').scrollTop=0;
}
function getMastered(){
  try{ return new Set(JSON.parse(localStorage.getItem('masteredIds')||'[]')); }catch(e){ return new Set(); }
}
function saveMastered(set){
  try{ localStorage.setItem('masteredIds', JSON.stringify([...set])); }catch(e){}
}
function startPractice(){
  const mastered = getMastered();
  const pool = BANK.filter(q=>!mastered.has(q.id));  // 只刷還沒答對的
  if(pool.length===0){
    alert('太厲害了!所有題目都已答對。\n按「重置刷題」可以重新開始。');
    session={mode:'practice',list:[...BANK],i:0,done:[],wrong:[],answered:false,mastered,combo:0};
    go('quiz'); renderQ(); return;
  }
  session={mode:'practice',list:pool,i:0,done:[],wrong:[],answered:false,mastered,combo:0};
  go('quiz'); renderQ();
}
function resetPractice(){
  if(confirm('重置刷題?已答對的紀錄會清空,所有題目重新開始。')){
    try{ localStorage.removeItem('masteredIds'); }catch(e){}
    startPractice();
  }
}
function showExamSetup(){ go('examset'); }
function startExam(){
  let n=parseInt(document.getElementById('examCount').value);
  let pool=[...BANK].sort(()=>Math.random()-0.5);
  if(n>0) pool=pool.slice(0,n);
  session={mode:'exam',list:pool,i:0,answered:false,picks:[],wrong:[]};
  go('quiz'); renderQ();
}
function renderQ(){
  const q=session.list[session.i];
  const total=session.list.length;
  document.getElementById('prog').style.width=((session.i)/total*100)+'%';
  document.getElementById('subtitle').textContent=
    (session.mode==='exam'?'模擬考':'刷題')+`　${session.i+1} / ${total}`;
  let html=`<div class="glass qcard">
    <div class="qmeta"><span class="cat">${q.category||'題目'}</span><span class="num">#${q.id}</span></div>
    <div class="qtext">${q.q}</div>`;
  q.options.forEach((opt,idx)=>{
    html+=`<div class="opt" data-i="${idx}" onclick="pick(${idx},event)">
      <span class="k">${'ABCDEFG'[idx]}</span><span>${opt}</span></div>`;
  });
  html+=`<div class="explain" id="exp"><b>解析　</b>${q.explain||'(無解析)'}</div></div>`;
  document.getElementById('qwrap').innerHTML=html;

  const nextBtn=document.getElementById('nextBtn');
  const prevBtn=document.getElementById('prevBtn');
  const resetBtn=document.getElementById('resetBtn');
  // 重置按鈕只在刷題模式顯示
  if(resetBtn) resetBtn.style.display = session.mode==='practice' ? 'block':'none';
  // 上一題按鈕:非第一題才顯示
  prevBtn.style.visibility = session.i>0 ? 'visible':'hidden';

  if(session.mode==='practice'){
    const picked = session.done[session.i];  // 曾作答過的選擇(可能 undefined)
    if(picked!==undefined && picked!==null){
      // 已答過→顯示原本作答結果與解析,但選項仍可點(直接改答案)
      session.answered=true;
      document.querySelectorAll('.opt').forEach(o=>{
        const i=+o.dataset.i;
        if(i===q.answer) o.classList.add('correct');
        else if(i===picked) o.classList.add('wrong');
      });
      document.getElementById('exp').classList.add('show');
      nextBtn.style.display='block';
    }else{
      session.answered=false;
      nextBtn.style.display='none';  // 未答不能下一題
    }
    nextBtn.textContent = session.i===total-1 ? '完成' : '下一題';
  }else{
    // 考試模式
    session.answered=false;
    nextBtn.style.display='block';
    nextBtn.textContent = session.i===total-1 ? '交卷' : '下一題';
    if(session.picks[session.i]!==undefined){
      const sel=document.querySelector(`.opt[data-i="${session.picks[session.i]}"]`);
      if(sel) sel.classList.add('sel');
    }
  }
}
function pick(idx, ev){
  const q=session.list[session.i];
  const el=document.querySelector(`.opt[data-i="${idx}"]`);
  if(el) fxRipple(el, ev);
  if(session.mode==='exam'){
    session.picks[session.i]=idx;
    document.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
    document.querySelector(`.opt[data-i="${idx}"]`).classList.add('sel');
    return;
  }
  // 刷題:若已答過,允許改選 → 先還原這題狀態再重新批改
  const prev = session.done[session.i];
  if(prev!==undefined && prev!==null){
    if(prev===idx) return;  // 點同一個不動作
    session.wrong = session.wrong.filter(w=>w.id!==q.id);  // 移除舊的錯題紀錄
  }
  session.answered=true;
  session.done[session.i]=idx;
  document.querySelectorAll('.opt').forEach(o=>{
    const i=+o.dataset.i;
    o.classList.remove('correct','wrong');
    if(i===q.answer) o.classList.add('correct');
    else if(i===idx) o.classList.add('wrong');
  });
  if(idx!==q.answer){
    session.wrong.push(q);
    fxWrong(); sndWrong();
    if(session.combo>=2) breakCombo();
    session.combo=0;
  }else{
    fxCorrect(el); sndCorrect();
    session.combo=(session.combo||0)+1;
    if(session.combo>=2) showCombo(session.combo);
  }
  // 答對→標記為精熟(下次不再出現);改成答錯→移出精熟
  if(session.mastered){
    if(idx===q.answer) session.mastered.add(q.id);
    else session.mastered.delete(q.id);
    saveMastered(session.mastered);
  }
  document.getElementById('exp').classList.add('show');
  document.getElementById('nextBtn').style.display='block';
}
function prevQ(){
  if(session.i>0){
    session.i--;
    renderQ();
    document.querySelector('main').scrollTop=0;
  }
}
function nextQ(){
  if(session.mode==='practice' && !session.answered) return;
  if(session.i < session.list.length-1){
    session.i++;
    renderQ();
    document.querySelector('main').scrollTop=0;
  }
  else finish();
}
function finish(){
  if(session.mode==='exam'){
    let correct=0;
    session.list.forEach((q,i)=>{
      if(session.picks[i]===q.answer) correct++;
      else session.wrong.push(q);
    });
    const total=session.list.length;
    const pct=Math.round(correct/total*100);
    animateNum(document.getElementById('scoreNum'), pct, 1100);
    document.getElementById('rCorrect').textContent=correct;
    document.getElementById('rWrong').textContent=total-correct;
    saveWrong(session.wrong);
    go('result');
    const arc=document.getElementById('ringArc');
    arc.style.strokeDashoffset=452;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      arc.style.strokeDashoffset = 452*(1-pct/100);
    }));
    // 電影級結果特效(及格線 60 分)
    setTimeout(()=>{ pct>=60 ? fxPass() : fxFail(); }, 900);
  }else{
    saveWrong(session.wrong);
    alert('這輪刷完了!答對的題目已消失,答錯的下次還會出現。\n按「重置刷題」可全部重來。');
    go('home');
  }
}
function confirmLeave(){
  const msg = session && session.mode==='practice'
    ? '要離開嗎?答對的題目已記錄,下次進來只會出現還沒答對的。'
    : '確定離開?這回合進度不會保留。';
  if(confirm(msg)) go('home');
}
function saveWrong(list){
  if(!list.length) return;
  let store=getWrong();
  list.forEach(q=>{ if(!store.find(x=>x.id===q.id)) store.push(q); });
  localStorage.setItem('wrongBank', JSON.stringify(store));
}
function getWrong(){
  try{ return JSON.parse(localStorage.getItem('wrongBank')||'[]'); }
  catch(e){ return []; }
}
let clearArmed=false;
function clearWrong(){
  const btn=document.getElementById('clearWrongBtn');
  if(!clearArmed){
    clearArmed=true;
    if(btn){ btn.textContent='確定清空?'; btn.classList.add('danger'); }
    // 3 秒內沒再按就取消
    clearTimeout(window._clearT);
    window._clearT=setTimeout(()=>{ clearArmed=false; if(btn){btn.textContent='清空';btn.classList.remove('danger');} }, 3000);
    return;
  }
  clearArmed=false;
  clearTimeout(window._clearT);
  try{ localStorage.removeItem('wrongBank'); }catch(e){}
  showReview();
}
function showReview(){
  go('review');
  clearArmed=false;
  const wrong=getWrong();
  const el=document.getElementById('revList');
  if(!wrong.length){
    el.innerHTML=`<div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="url(#lg)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2 5 5 .5-4 3.5 1.5 5L12 19l-4.5 3 1.5-5-4-3.5 5-.5z"/></svg>
      <div>還沒有錯題。<br>去刷題或模擬考,答錯的會自動收進這裡。</div></div>`;
    return;
  }
  let html=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
    <span style="font-weight:700;font-size:16px">錯題本 (${wrong.length})</span>
    <button class="clear-btn" id="clearWrongBtn" onclick="clearWrong()">清空</button></div>`;
  wrong.forEach(q=>{
    html+=`<div class="glass rev-item">
      <div class="rq">${q.q}</div>
      <div class="ra">正解:${'ABCDEFG'[q.answer]}　${q.options[q.answer]}</div>
      ${q.explain?`<div class="re">${q.explain}</div>`:''}
    </div>`;
  });
  el.innerHTML=html;
}
let readState = { cat:'全部', page:0, per:20 };
function showRead(){
  go('read');
  readState.page = 0;
  renderRead();
}
function renderRead(){
  const el=document.getElementById('readList');
  if(!BANK.length){ el.innerHTML=`<div class="empty"><div>題庫是空的。</div></div>`; return; }
  // 分類清單
  const cats = ['全部', ...Array.from(new Set(BANK.map(q=>q.category||'其他')))];
  let chips = cats.map(c=>`<button class="rchip${c===readState.cat?' on':''}" data-cat="${c.replace(/"/g,'&quot;')}" onclick="readSetCat(this.dataset.cat)">${c}</button>`).join('');
  // 骨架:籤列只建一次,題目另一個容器獨立更新
  el.innerHTML =
    `<div class="rchips" id="rchips">${chips}</div>
     <div style="margin:4px 0 12px;font-weight:700;font-size:15px" id="rcount"></div>
     <div id="rItems"></div>
     <div id="rMore"></div>`;
  enableChipDrag(document.getElementById('rchips'));
  renderReadItems();
}
// 只更新題目列表,不動籤列(避免跳回頂部/重置卷動)
function renderReadItems(){
  const list = readState.cat==='全部' ? BANK : BANK.filter(q=>(q.category||'其他')===readState.cat);
  const total = list.length;
  const shown = Math.min((readState.page+1)*readState.per, total);
  const slice = list.slice(0, shown);
  let items='';
  slice.forEach((q)=>{
    let opts='';
    q.options.forEach((opt,idx)=>{
      const on = idx===q.answer ? ' read-on':'';
      opts+=`<div class="read-opt${on}"><span class="rk">${'ABCDEFG'[idx]}</span><span>${opt}</span>${idx===q.answer?'<span class="tick">✓</span>':''}</div>`;
    });
    items+=`<div class="glass read-item">
      <div class="read-head" onclick="toggleExp(${q.id})">
        <span class="read-no">#${q.id}</span>
        <span class="read-q">${q.q}</span>
        ${q.explain?`<span class="read-caret" id="caret-${q.id}">›</span>`:''}
      </div>
      <div class="read-opts">${opts}</div>
      ${q.explain?`<div class="read-exp" id="rexp-${q.id}"><b>解析　</b>${q.explain}</div>`:''}
    </div>`;
  });
  const more = shown<total
    ? `<button class="btn ghost" onclick="readMore()">載入更多(還有 ${total-shown} 題)</button>`
    : `<div style="text-align:center;color:var(--muted);font-size:13px;padding:14px">已顯示全部 ${total} 題</div>`;
  const cnt=document.getElementById('rcount'); if(cnt) cnt.textContent=`${readState.cat}　顯示 ${shown} / ${total}`;
  const it=document.getElementById('rItems'); if(it) it.innerHTML=items;
  const mo=document.getElementById('rMore'); if(mo) mo.innerHTML=more;
}
function readSetCat(c){
  if(readState.cat===c) return;
  readState.cat=c; readState.page=0;
  // 只換 .on 狀態,不重建籤列
  document.querySelectorAll('#rchips .rchip').forEach(b=>b.classList.toggle('on', b.dataset.cat===c));
  renderReadItems();          // 只更新題目,不碰籤列與其卷動位置,也不主動捲動頁面
}
function readMore(){ readState.page++; renderReadItems(); }
// 桌機:滑鼠拖曳 + 滾輪橫向卷動籤列
function enableChipDrag(box){
  if(!box || box._dragBound) return; box._dragBound=true;
  let down=false, moved=false, sx=0, sl=0;
  box.addEventListener('mousedown', e=>{ down=true; moved=false; sx=e.pageX; sl=box.scrollLeft; });
  window.addEventListener('mousemove', e=>{
    if(!down) return;
    const d=e.pageX-sx;
    if(!moved && Math.abs(d)>5){ moved=true; box.classList.add('dragging'); }  // 超過閾值才算拖曳,此時才鎖點擊
    if(moved){ box.scrollLeft=sl-d; }
  });
  window.addEventListener('mouseup', ()=>{
    if(!down) return; down=false;
    if(moved){ setTimeout(()=>box.classList.remove('dragging'),0); }  // 拖曳結束後才解鎖,避免放開瞬間誤觸
  });
  // 直向滾輪 → 橫向卷動
  box.addEventListener('wheel', e=>{
    if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){ box.scrollLeft+=e.deltaY; e.preventDefault(); }
  }, {passive:false});
}
function toggleExp(id){

/* ===== 電影級特效引擎 ===== */
const fxC=document.getElementById('fxCanvas'), fx=fxC.getContext('2d');
let P=[]; let fxRun=false;
function fxSize(){ fxC.width=innerWidth*devicePixelRatio; fxC.height=innerHeight*devicePixelRatio; fx.scale(devicePixelRatio,devicePixelRatio); }
fxSize(); addEventListener('resize',fxSize);
const COLORS=['#22d3ee','#8b5cf6','#ec4899','#34d399','#facc15','#eaf0ff'];
function spawn(n,cfg){
  for(let i=0;i<n;i++){
    const a=cfg.angle!==undefined?cfg.angle+(Math.random()-.5)*cfg.spread:Math.random()*Math.PI*2;
    const sp=cfg.speed*(0.4+Math.random()*0.9);
    P.push({x:cfg.x,y:cfg.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      g:cfg.g??0.12, life:1, decay:cfg.decay??0.012+Math.random()*0.01,
      size:cfg.size*(0.5+Math.random()), color:cfg.colors?cfg.colors[Math.floor(Math.random()*cfg.colors.length)]:COLORS[Math.floor(Math.random()*COLORS.length)],
      shape:cfg.shape||'rect', rot:Math.random()*Math.PI, vr:(Math.random()-.5)*0.3});
  }
  if(!fxRun){ fxRun=true; requestAnimationFrame(fxTick); }
}
function fxTick(){
  fx.clearRect(0,0,innerWidth,innerHeight);
  P=P.filter(p=>p.life>0);
  for(const p of P){
    p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.vx*=0.99; p.life-=p.decay; p.rot+=p.vr;
    fx.save(); fx.globalAlpha=Math.max(p.life,0); fx.translate(p.x,p.y); fx.rotate(p.rot);
    fx.fillStyle=p.color; fx.shadowColor=p.color; fx.shadowBlur=8;
    if(p.shape==='rect') fx.fillRect(-p.size/2,-p.size/4,p.size,p.size/2);
    else { fx.beginPath(); fx.arc(0,0,p.size/2,0,7); fx.fill(); }
    fx.restore();
  }
  if(P.length){ requestAnimationFrame(fxTick); } else { fxRun=false; fx.clearRect(0,0,innerWidth,innerHeight); }
}
/* 點選漣漪 */
function fxRipple(el, ev){
  const r=el.getBoundingClientRect();
  const x=(ev&&ev.clientX?ev.clientX:r.left+r.width/2)-r.left;
  const y=(ev&&ev.clientY?ev.clientY:r.top+r.height/2)-r.top;
  const s=Math.max(r.width,r.height);
  const d=document.createElement('span'); d.className='ripple';
  d.style.cssText=`width:${s}px;height:${s}px;left:${x-s/2}px;top:${y-s/2}px`;
  el.appendChild(d); setTimeout(()=>d.remove(),600);
}

/* CG 感:卡片按壓 3D 傾斜(依觸點位置) */
document.querySelectorAll('#v-home .tile').forEach(t=>{
  const tilt=e=>{
    const p=e.touches?e.touches[0]:e;
    const r=t.getBoundingClientRect();
    const dx=(p.clientX-r.left)/r.width-.5, dy=(p.clientY-r.top)/r.height-.5;
    t.style.transform=`perspective(700px) rotateX(${-dy*7}deg) rotateY(${dx*9}deg) scale(.975)`;
  };
  const reset=()=>{ t.style.transform=''; };
  t.addEventListener('touchstart',tilt,{passive:true});
  t.addEventListener('touchmove',tilt,{passive:true});
  t.addEventListener('touchend',reset);
  t.addEventListener('touchcancel',reset);
  t.addEventListener('mousedown',tilt);
  t.addEventListener('mouseup',reset);
  t.addEventListener('mouseleave',reset);
});

/* ===== 合成音效引擎(Web Audio,無音檔) ===== */
let AC=null, muted = localStorage.getItem('muted')==='1';
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return AC; }
function tone(freq,dur,type='sine',gain=0.15,when=0,slideTo=null){
  const c=ac(); if(!c||muted) return;
  const t=c.currentTime+when;
  const o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
  g.gain.setValueAtTime(gain,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t+dur+0.05);
}
const sndTap    =()=> tone(880,0.06,'sine',0.06);
const sndCorrect=()=>{ tone(660,0.09,'sine',0.14); tone(990,0.14,'sine',0.12,0.07); };

const sndCombo  =n=>{ tone(520+ n*90,0.1,'square',0.09); tone(780+n*90,0.12,'square',0.07,0.06); };
const sndPass   =()=>{ [523,659,784,1047].forEach((f,i)=> tone(f,0.22,'triangle',0.14,i*0.13)); tone(1318,0.5,'triangle',0.12,0.55); };
const sndFail   =()=>{ [392,330,262,196].forEach((f,i)=> tone(f,0.3,'sine',0.12,i*0.18)); };

function comboTier(n){ return n>=10?['#ec4899','36px']: n>=6?['#facc15','32px']: n>=4?['#22d3ee','28px']:['#8b5cf6','24px']; }

/* ===== 數字滾動 ===== */
function animateNum(el, target, dur=800){
  const start=performance.now();
  const from=0;
  function step(t){
    const p=Math.min((t-start)/dur,1);
    const ease=1-Math.pow(1-p,3);
    el.textContent=Math.round(from+(target-from)*ease);
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
